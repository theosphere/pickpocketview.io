<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="./favicon.png" />
<title>pickpocketview</title>
<style>
  :root {
    --accent: #d4784a;
    --bg: #fafaf8;
    --text: #1c1c1c;
    --muted: #6b6b6b;
    --card-border: #e5e2dc;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Georgia, 'Times New Roman', serif;
    line-height: 1.5;
    padding: 24px 16px 60px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  header { margin-bottom: 32px; }
  h1 {
    font-weight: normal;
    font-size: 28px;
    color: var(--accent);
    margin: 0 0 4px;
  }
  .projects {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .card {
    display: block;
    text-decoration: none;
    color: inherit;
    border: 1px solid var(--card-border);
    border-radius: 8px;
    overflow: hidden;
    background: #fff;
    transition: border-color 0.15s ease;
  }
  .card:hover, .card:focus-visible {
    border-color: var(--accent);
  }
  .card-image {
    width: 100%;
    aspect-ratio: 16 / 10;
    background: #141414;
    overflow: hidden;
  }
  .card-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .card-body { padding: 14px 16px 16px; }
  .card-title {
    font-size: 18px;
    margin: 0 0 4px;
    color: var(--text);
  }
  .card-desc {
    font-family: system-ui, sans-serif;
    font-size: 14px;
    color: var(--muted);
    margin: 0;
  }
  @media (min-width: 640px) {
    body { padding-top: 60px; }
    h1 { font-size: 32px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>pickpocketview</h1>
    </header>
    <div class="projects">
      <a class="card" href="./still-moving-tree.html">
        <div class="card-image">
          <img src="./still-moving-tree.gif" alt="still-moving-tree: an animated ink-style tree swaying in simulated wind" loading="lazy" />
        </div>
        <div class="card-body">
          <h2 class="card-title">still-moving-tree</h2>
          <p class="card-desc">A tree whose shape stays still, but never stops moving &mdash; noise-driven wind, ink-sketch shading, a slow-bleeding trunk.</p>
        </div>
      </a>
    </div>
  </div>
</body>
</html>
