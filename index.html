<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="./favicon.png" />
<title>Pickpocket View</title>
<style>
  :root {
    --accent: #d4784a;
    --bg: #fafaf8;
    --text: #1c1c1c;
    --muted: #6b6b6b;
    --card-border: #e5e2dc;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Georgia, 'Times New Roman', serif;
    line-height: 1.5;
    padding: 24px 16px 60px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  header { margin-bottom: 32px; }
  h1 {
    font-weight: normal;
    font-size: 28px;
    color: var(--accent);
    margin: 0 0 4px;
  }
  header p {
    font-family: system-ui, sans-serif;
    font-size: 14px;
    color: var(--muted);
    margin: 0;
  }
  .projects {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .card {
    display: block;
    text-decoration: none;
    color: inherit;
    border: 1px solid var(--card-border);
    border-radius: 8px;
    overflow: hidden;
    background: #fff;
    transition: border-color 0.15s ease;
  }
  .card:hover, .card:focus-visible {
    border-color: var(--accent);
  }
  .card-image {
    width: 100%;
    aspect-ratio: 16 / 10;
    background: linear-gradient(180deg, #1c1c1c 0%, #2a2a2a 100%);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card-image svg { width: 36%; height: 36%; opacity: 0.85; }
  .card-body { padding: 14px 16px 16px; }
  .card-title {
    font-size: 18px;
    margin: 0 0 4px;
    color: var(--text);
  }
  .card-desc {
    font-family: system-ui, sans-serif;
    font-size: 14px;
    color: var(--muted);
    margin: 0;
  }
  footer {
    margin-top: 48px;
    font-family: system-ui, sans-serif;
    font-size: 13px;
    color: var(--muted);
  }
  @media (min-width: 640px) {
    body { padding-top: 60px; }
    h1 { font-size: 32px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>pickpocket view</h1>
      <p>small things, built by hand.</p>
    </header>
    <div class="projects">
      <a class="card" href="https://theosphere.github.io/still-moving-tree/step5.html">
        <div class="card-image">
          <!-- placeholder icon — swap for a real screenshot of the project -->
          <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <circle cx="50" cy="35" r="28" fill="#d4d4d0"/>
            <rect x="45" y="55" width="10" height="35" fill="#8a7d6e"/>
          </svg>
        </div>
        <div class="card-body">
          <h2 class="card-title">still-moving-tree</h2>
          <p class="card-desc">A tree whose shape stays still, but never stops moving &mdash; noise-driven wind, ink-sketch shading, a slow-bleeding trunk.</p>
        </div>
      </a>
    </div>
    <footer>made by hand.</footer>
  </div>
</body>
</html>
